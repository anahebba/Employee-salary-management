spring.application.name=salary-management

spring.datasource.url=jdbc:postgresql://localhost:5432/salary_db
spring.datasource.username=${DB_USERNAME:acme}
spring.datasource.password=${DB_PASSWORD:acme}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=8081
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE